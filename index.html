<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .side-image{
            height: 750px;
            object-fit: cover;
        }
        @media(max-width: 991.81px){
            .side-image{
                height: 150px;

            }
        }
    </style>

<body class="bg-light">
<div class="container">
    <div class="row gx-4 p-md-5">
    <div class="col-md-12 p-5 col-lg-6 col-sm-12 mt-2 bg-white rounded shadow order-2 order-lg-1">
        <h3 class="fw-bold">Get Started Now</h3>
        <form class="mt-5">
            <div class="mb-3">
                <label for="name" class="small fw-bold">Name</label>
                <input type="name" class="form-control" placeholder="Enter your name">
            </div>
            <div class="mb-3">
                <label for="email" class="small fw-bold">Email </label>
                <input type="email" class="form-control" id="email" aria-describedby="emailHelp" placeholder="example@gmail.com">
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
            <div class="mb-2">
                <label for="password" class="small fw-bold">Password</label>
                <input type="password" class="form-control" placeholder="at least 8 characters">
            </div>
            <div class="mb-3">
                <label class="small fw-bold">
                    <input type="checkbox">
                    I agree to the <a href="#">terms and conditions</a>
                </label>
            </div>
            <button type="submit" class="btn btn-success w-100 rounded-4 mt-4 mb-5">Sign up</button>
            <div class="mb-5 text-center">or</div>
            <div class="text-center">
            <button type="submit" class="btn btn-light border"><img src="https://www.google.com/favicon.ico" alt="" width="30" height="25" gap-5> Sign in with Google</button>
            <button type="submit" class="btn btn-light border"><img src="https://www.apple.com/favicon.ico" alt="" width="30" height="25" > Sign in with Apple</button>
            </div> 
            <p class="fw-bold small mt-2 text-center">Have an account? <a href="#">Sign in</a> </p>
        </form>
    </div>

    <div class="col-md-12 col-lg-6 col-sm-12 mt-2 order-1 order-lg-2">
     
        <img src="img\chris-lee-70l1tDAI6rM-unsplash 2.png" alt="" class="img-fluid w-100  rounded-3 side-image">
    </div>


</div>    
</div>
